name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Download and setup SDL2
      run: |
        wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.6/SDL2-devel-2.30.6-android.tar.gz
        tar -xf SDL2-devel-2.30.6-android.tar.gz
        mkdir -p app/jniLibs/SDL2/include
        mkdir -p app/jniLibs/SDL2/lib/arm64-v8a
        cp -r SDL2-2.30.6/android/jni/SDL2/include/* app/jniLibs/SDL2/include/
        cp SDL2-2.30.6/android/jni/SDL2/libs/arm64-v8a/libSDL2.so app/jniLibs/SDL2/lib/arm64-v8a/

    - name: Build APK
      run: |
        gradle assembleDebug
      env:
        ANDROID_NDK_HOME: $ANDROID_HOME/ndk/25.1.8937393

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: APK
        path: app/build/outputs/apk/debug/app-debug.apk
